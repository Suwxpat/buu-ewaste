<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f7a43"><meta name="color-scheme" content="light dark"><title>BUU E-Waste Hub</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%230f7a43'/%3E%3Cpath d='M11 29c0-9 6-15 18-16 0 10-6 16-15 16' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='31' cy='10' r='3.2' fill='%23f2b705'/%3E%3C/svg%3E"><style>*,*:before,*:after{box-sizing:border-box}html,body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Maitree:wght@400;500;600&family=Mitr:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f2f5ef;--bg2:#e8eee4;--surface:#fff;--surface2:#f6f8f3;--ink:#14201a;--ink2:#415047;--muted:#5d6c62;--line:#dde4d9;--line2:#c8d2c4;
  --accent:#0f7a43;--accent-d:#0a5c32;--on-accent:#fff;--accent-soft:#dcf1e3;--accent-ink:#0a5c32;
  --gold:#f2b705;--gold-d:#b98a00;--gold-soft:#fff0bd;--on-gold:#2b2100;--gold-ink:#7a5b00;
  --danger:#c0352b;--danger-soft:#fbe5e2;--info-soft:#e3eefb;--info-ink:#1b4f8f;
  --s-good:#0ca30c;--s-warn:#fab219;--s-serious:#ec835a;--s-crit:#d03b3b;
  --c-surface:#fcfcfb;--grid:#e1e0d9;--axis:#c3c2b7;--c-muted:#898781;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
  --shadow:0 1px 2px rgba(20,32,26,.05),0 8px 24px rgba(20,32,26,.07);--shadow-lg:0 12px 40px rgba(10,30,20,.22);
  --adm-side:#0a3d25;--adm-side2:#13553a;--adm-ink:#e8f5ee;--adm-mut:#a7c9b5;
  --r:18px;--r-sm:12px;
  --f-ui:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI","Sarabun",Tahoma,system-ui,sans-serif;
  --f-head:"Mitr","IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --f-bless:"Maitree","Noto Serif Thai","IBM Plex Sans Thai","Leelawadee UI",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0c1310;--bg2:#111b16;--surface:#16211c;--surface2:#1b2923;--ink:#eaf3ed;--ink2:#bccbc1;--muted:#93a69a;--line:#263830;--line2:#35493f;
  --accent:#35c47a;--accent-d:#2bab6a;--on-accent:#04210f;--accent-soft:#143a27;--accent-ink:#8be0b2;
  --gold-soft:#3a2f08;--gold-ink:#f6d36a;--danger:#ee6a60;--danger-soft:#3b1815;--info-soft:#16283f;--info-ink:#8fb8ee;
  --c-surface:#1a1a19;--grid:#2c2c2a;--axis:#383835;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --adm-side:#08140f;--adm-side2:#12281d;--adm-ink:#eaf3ed;--adm-mut:#8fab9b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1310;--bg2:#111b16;--surface:#16211c;--surface2:#1b2923;--ink:#eaf3ed;--ink2:#bccbc1;--muted:#93a69a;--line:#263830;--line2:#35493f;
  --accent:#35c47a;--accent-d:#2bab6a;--on-accent:#04210f;--accent-soft:#143a27;--accent-ink:#8be0b2;
  --gold-soft:#3a2f08;--gold-ink:#f6d36a;--danger:#ee6a60;--danger-soft:#3b1815;--info-soft:#16283f;--info-ink:#8fb8ee;
  --c-surface:#1a1a19;--grid:#2c2c2a;--axis:#383835;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --adm-side:#08140f;--adm-side2:#12281d;--adm-ink:#eaf3ed;--adm-mut:#8fab9b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 12px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none!important}
.i{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.i.lg{width:1.7em;height:1.7em}.i.xl{width:2.2em;height:2.2em}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:13px;line-height:1.5}.center{text-align:center}.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.sp{flex:1}.gap8{gap:8px}.gap12{gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:1.5px solid transparent;border-radius:999px;font-weight:600;font-size:16px;line-height:1.2;text-align:center;text-decoration:none;transition:transform .12s,box-shadow .15s,background .15s;white-space:nowrap;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{background:var(--accent-d)}
.btn.gold{background:var(--gold);color:var(--on-gold);box-shadow:0 6px 18px rgba(242,183,5,.4)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4);backdrop-filter:blur(6px)}
.btn.glass:hover{background:rgba(255,255,255,.26)}
.btn.danger{background:var(--danger);color:#fff}
.btn.lg{min-height:54px;font-size:17px;padding:0 26px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.xs{min-height:32px;padding:0 11px;font-size:13px;gap:6px}
.btn.block{display:flex;width:100%}
.btn[disabled],.btn.off{opacity:.5;pointer-events:none;box-shadow:none}
.ibtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);position:relative}
.ibtn:hover{background:var(--surface2)}
.ibtn .dot{position:absolute;top:8px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--s-crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}

/* ---- cards / chips / form ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card,.card+section,section+.card{margin-top:14px}
.card h3{font-size:17px;line-height:1.35;font-weight:600}
.card .sub{color:var(--muted);font-size:14px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.sm{min-height:28px;padding:0 10px;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:600;line-height:1.6}
.tag.gold{background:var(--gold-soft);color:var(--gold-ink)}.tag.grey{background:var(--bg2);color:var(--muted)}.tag.red{background:var(--danger-soft);color:var(--danger)}.tag.blue{background:var(--info-soft);color:var(--info-ink)}
label.f{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.inp{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line2);border-radius:14px;background:var(--surface);color:var(--ink);font-size:16px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{font-size:13.5px;color:var(--danger);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:14px;background:var(--line2);transition:.2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i:after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

/* ---- modal / toast ---- */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,18,13,.55);backdrop-filter:blur(3px);animation:fade .2s}
.modal{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg);animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.modal.small{top:50%;bottom:auto;transform:translate(-50%,-50%);border-radius:24px;width:min(420px,calc(100% - 32px));animation:pop .2s}
.modal.wide{width:min(760px,100%)}
@media(min-width:700px){.modal{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:26px;animation:pop .2s;max-height:90vh}}
.mh{font-size:20px;line-height:1.35;font-weight:700;margin-bottom:6px}.mp{color:var(--ink2);font-size:15px}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.mclose{position:absolute;right:12px;top:12px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:200;max-width:min(92vw,460px);padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:500;box-shadow:var(--shadow-lg);transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--danger);color:#fff}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translate(-50%,40px);opacity:0}}@keyframes pop{from{transform:translate(-50%,-46%) scale(.96);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- shell ---------- */
body{background:var(--bg2)}
.app{max-width:560px;margin:0 auto;padding:0 16px 132px;min-height:100vh;background:var(--bg)}
@media(min-width:700px){.app{box-shadow:0 0 0 1px var(--line),0 0 60px rgba(10,40,25,.08)}}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.logo{width:40px;height:40px;flex:none}
.bt b{display:block;font:600 18px/1.15 var(--f-head)}.bt small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
#view{outline:none}
.pagehead{padding:14px 2px 10px}.pagehead h2{font:600 26px/1.3 var(--f-head)}.pagehead p{margin-top:2px;font-size:14.5px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin:22px 0 8px;line-height:1.7}
.banner{display:flex;gap:10px;align-items:center;margin:4px 0 8px;padding:10px 12px;border-radius:14px;font-size:13.5px;line-height:1.45}
.banner.warn{background:var(--gold-soft);color:var(--gold-ink)}.banner.sample{background:var(--info-soft);color:var(--info-ink)}
.banner .btn{margin-left:auto;flex:none}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;min-height:54px;font-weight:500}
.tabs button .i{width:24px;height:24px}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs .fab{color:var(--ink);font-weight:700}
.tabs .fab i{display:grid;place-items:center;width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--gold);color:var(--on-gold);box-shadow:0 8px 20px rgba(242,183,5,.5);border:4px solid var(--bg)}
.tabs .fab .i{width:28px;height:28px}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;margin-top:6px;color:#fff;background:linear-gradient(140deg,#0a5430 0%,#0f7a43 54%,#17995a 100%);box-shadow:0 14px 34px rgba(10,70,40,.28)}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(242,183,5,.6),transparent 66%);pointer-events:none}
.hero-art{position:absolute;inset:0;color:rgba(255,255,255,.17)}.hero-art svg{width:100%;height:100%;display:block}
.hero-in{position:relative;z-index:1;padding:26px 22px 24px}
.eyebrow{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;opacity:.92}
.hero h1{font:600 32px/1.25 var(--f-head);margin:10px 0 8px}
.lead{font-size:15.5px;line-height:1.65;opacity:.94;max-width:36ch}
.hero-kpi{display:flex;align-items:flex-end;gap:12px;margin:18px 0 20px}
.hero-kpi .big{font:700 58px/1 var(--f-ui);letter-spacing:-.02em}
.hero-kpi .unit{font-size:19px;font-weight:600;line-height:1.25;padding-bottom:4px}.hero-kpi small{display:block;font-size:13px;font-weight:400;opacity:.9}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-cta .btn{flex:1 1 150px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile-s{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.tile-s b{display:block;font-size:22px;line-height:1.2;font-weight:700}.tile-s span{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.how{list-style:none;margin:10px 0 0;padding:0}
.how li{display:grid;grid-template-columns:24px 46px 1fr;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.how li:first-child{border-top:0}
.hn{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-size:13px;font-weight:700}
.hi{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}.hi .i{width:24px;height:24px}
.how b{display:block}.how small{display:block;color:var(--muted);font-size:13.5px;line-height:1.5}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.type{background:var(--surface2);border-radius:14px;padding:12px}.type .ti{margin-bottom:8px}
.type b{display:block;font-size:15px;line-height:1.35}.type small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.ti{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.feed{list-style:none;margin:8px 0 0;padding:0}
.feed li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.feed li:first-child{border-top:0}
.feed b{display:block;font-size:15px;line-height:1.4}.feed small{display:block;color:var(--muted);font-size:13px}
.fi{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.note{display:flex;gap:14px;align-items:flex-start}.note>.i{color:var(--accent);flex:none;margin-top:2px}.note b{display:block}

/* ---------- map ---------- */
.mapwrap{margin-top:8px}
.map{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:#e7eee0;touch-action:none;cursor:grab;height:min(62vh,560px);min-height:340px;-webkit-user-select:none;user-select:none}
.map.grab{cursor:grabbing}
.map-layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.map-img{display:block;width:478px;height:944px;max-width:none;pointer-events:none;-webkit-user-drag:none}
.map-pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;width:44px;height:50px;margin:-50px 0 0 -22px;padding:0;border:0;background:none;pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;--pc:var(--accent)}
.pin-in{position:relative;display:block;width:30px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin-in svg{display:block}
.pin-bg{fill:var(--pc);stroke:#fff;stroke-width:2}.pin-ic{stroke:var(--pc);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pin.off{--pc:#7d8a83}
.pin.lv-ok{--pc:var(--s-good)}.pin.lv-near{--pc:var(--s-warn)}.pin.lv-due{--pc:var(--s-serious)}.pin.lv-over{--pc:var(--s-crit)}
.pin em{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--surface);color:var(--ink);font:600 11px/1 var(--f-ui);font-style:normal;padding:3px 6px;border-radius:8px;border:1px solid var(--line2);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.map:not(.zoomed) .pin.lzg:not(.sel) em{display:none}
.pin.sel .pin-in{animation:bob .7s ease-in-out infinite alternate}
.pin.sel .pin-bg{stroke:var(--gold);stroke-width:3}
@keyframes bob{to{transform:translateY(-6px)}}
.map-ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:8}
.map-ctl button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.map-credit{position:absolute;left:8px;bottom:6px;font-size:10.5px;background:rgba(255,255,255,.82);color:#333;padding:1px 7px;border-radius:6px;pointer-events:none}
.searchbar{position:relative;margin-top:12px}.searchbar>.i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}.searchbar .inp{padding-left:44px}

/* ---------- blessing ---------- */

/* ---------- mine ---------- */

/* ---------- levels · meters ---------- */

.vt-s{color:var(--ink2);font-size:12.5px;margin-top:2px}
.hb{list-style:none;margin:0;padding:0;display:grid;gap:2px}

.hb-v{font-size:13.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}.hb-v b{color:var(--ink);font-size:15px}.hb-v small{color:var(--muted);font-size:12.5px}

/* ---------- ledger ---------- */
.listc{padding:6px 10px}
.ledger{list-style:none;margin:8px 0 0;padding:0}.listc .ledger{margin:0}
.ledger li{border-top:1px solid var(--line)}.ledger li:first-child{border-top:0}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:10px 6px;border-radius:12px;color:var(--ink)}
.lrow:hover{background:var(--surface2)}.lrow.void{opacity:.62}.lrow.void .lr-w b{text-decoration:line-through}
.lr-t{flex:1;min-width:0}.lr-t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}.lr-t small{display:block;color:var(--muted);font-size:13px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-w{text-align:right;flex:none}.lr-w b{display:block;font-size:16px;line-height:1.25}.lr-w small{color:var(--muted);font-size:12px}
.lrow .tag{flex:none}
.only-m{display:none}
@media(max-width:599px){.only-m{display:inline}.hide-m{display:none!important}}
.empty-s{padding:24px;text-align:center;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px 4px}

/* ---------- points & alerts ---------- */
.ptgrid{display:grid;gap:14px;margin-top:6px}
@media(min-width:1000px){.ptgrid{grid-template-columns:minmax(340px,5fr) 7fr;align-items:start}.ptmap{position:sticky;top:80px}}
#a-map.map{height:min(56vh,520px)}
.plist-a{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.prw{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--lv);border-radius:16px;padding:14px;box-shadow:var(--shadow);scroll-margin-top:90px}
.prw.sel{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent)}.prw.off{opacity:.82}
.pr-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pr-h b{flex:1 1 150px;min-width:0;line-height:1.35}
.pr-code{font:600 12px/1 var(--f-ui);padding:4px 7px;border-radius:7px;background:var(--bg2);color:var(--ink2);letter-spacing:.04em}
.pr-v{display:flex;align-items:center;gap:12px;margin-top:10px}.pr-kg{flex:none;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink2)}.pr-kg b{font-size:22px;color:var(--ink)}.pr-v .meter{flex:1}
.pr-i{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.55}.pr-i b{color:var(--ink2);font-weight:600}
.pr-a{display:flex;gap:8px;flex-wrap:wrap}
.pkinfo{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--lv) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--lv) 35%,var(--surface))}
.pkinfo small{display:block;color:var(--muted);font-size:12.5px}.pkinfo b{display:block;font-size:24px;line-height:1.3}
#pm-map.map{height:300px;min-height:260px}
.swrow{display:flex;align-items:center;gap:10px}
.dl{margin:0}.dl>div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line)}.dl>div:first-child{border-top:0}
.dl dt{color:var(--muted);font-size:14px}.dl dd{margin:0;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0}

/* ---------- rounds ---------- */
.rounds{list-style:none;margin:0;padding:0;display:grid;gap:12px}
@media(min-width:900px){.rounds{grid-template-columns:1fr 1fr}}
.rnd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.rd-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rd-h b{display:block;line-height:1.35}.rd-h small{display:block;color:var(--muted);font-size:13px}
.rd-w{display:flex;gap:20px;align-items:flex-end;margin:12px 0;flex-wrap:wrap}.rd-w>div{display:flex;flex-direction:column}.rd-w small{color:var(--muted);font-size:12px}.rd-w b{font-size:24px;line-height:1.2}.rd-w i{font-style:normal;color:var(--muted);font-size:12.5px}.rd-v{margin-left:auto}

/* ---------- QR & posters ---------- */
.qgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.qc-q{width:min(150px,100%);aspect-ratio:1;margin:0 auto 10px;display:grid;place-items:center;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.qc-q .qrsvg{width:100%;height:100%;display:block}
.qc b{display:block;line-height:1.35;font-size:14.5px}.qc small{display:block;color:var(--muted);font-size:12.5px}.qc-b{justify-content:center;margin-top:10px}
.qrbox{width:min(300px,86%);margin:0 auto;padding:10px;background:#fff;border-radius:16px;border:1px solid var(--line)}.qrbox .qrsvg{width:100%;height:auto;display:block}
.linktxt{word-break:break-all;color:var(--ink2)}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.shp img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}

/* ---------- settings ---------- */
.setgrid{display:grid;gap:14px}@media(min-width:900px){.setgrid{grid-template-columns:1fr 1fr}}
.setgrid>.card{margin-top:0}
.fld .unit{white-space:nowrap}
.audit{list-style:none;margin:0;padding:0}.audit li{display:grid;grid-template-columns:120px 150px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.audit li:first-child{border-top:0}.audit time{color:var(--muted)}.audit span{color:var(--ink2);overflow-wrap:anywhere}
@media(max-width:620px){.audit li{grid-template-columns:1fr;gap:0}}

/* ---------- scan modal ---------- */
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;margin-top:12px;aspect-ratio:4/3;max-height:52vh;width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:16%;pointer-events:none}
.scanframe i{position:absolute;width:28px;height:28px;border:4px solid var(--gold)}
.scanframe i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.scanframe i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.scanframe i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.scanframe i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.scan-msg{margin-top:10px;font-size:14px;color:var(--ink2);line-height:1.5}.scan-msg.bad{color:var(--danger)}
.manual{border-top:1px solid var(--line);padding-top:4px}
#pm-map .pin{pointer-events:none}
.saveimg{display:block;max-width:100%;max-height:62vh;margin:14px auto 0;border-radius:12px;border:1px solid var(--line);background:#fff}   /* taps on the picker map always place the new pin, never hit an existing one */
/* spacing helpers repeated last so they beat component rules such as .ledger{margin:0} */
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}

<script>
/* ============ shim.js — พาแอปคุยกับ Google Sheets (Apps Script) แทนฐานข้อมูลของ claude.ai ============
   แอปเดิมเรียก claude.use('db' | 'user' | 'downloads') ไฟล์นี้ทำให้คำเรียกเดิมทำงานบนเว็บทั่วไปได้
   - ใครเปิดหน้าเว็บก็ส่งรายการทิ้งได้ (ไม่ต้องล็อกอิน) ส่วนหลังบ้านต้องใส่รหัสผู้ดูแล
   - รหัสผู้ดูแลถูกตรวจที่ฝั่ง Apps Script เสมอ ไม่ได้ตรวจในหน้าเว็บ */
(function () {
  'use strict';
  const CFG = window.BUU_CONFIG || {};
  const raw = typeof CFG.API_URL === 'string' ? CFG.API_URL.trim() : '';
  const API = /^https:\/\/script\.google(usercontent)?\.com\/\S+$/.test(raw) || /^http:\/\/(127\.0\.0\.1|localhost):\d+\/\S*$/.test(raw) ? raw : '';
  const SK = 'buu.adminkey', FLAG = 'buu.flag';
  const memKey = { v: '' };
  const BUU = window.BUU = { standalone: true, api: API, down: false, ready: false, poll: null };

  /* ---------- รหัสผู้ดูแล (เก็บในเครื่องของผู้ดูแลเท่านั้น) ---------- */
  const getKey = () => { try { return sessionStorage.getItem(SK) || localStorage.getItem(SK) || memKey.v || ''; } catch (e) { return memKey.v; } };
  const clearKey = () => { memKey.v = ''; try { sessionStorage.removeItem(SK); localStorage.removeItem(SK); } catch (e) { } };
  const putKey = (k, remember) => { memKey.v = k; try { sessionStorage.setItem(SK, k); if (remember) localStorage.setItem(SK, k); else localStorage.removeItem(SK); } catch (e) { } };
  const setFlag = v => { try { sessionStorage.setItem(FLAG, v); } catch (e) { } };
  BUU.takeFlag = () => { try { const v = sessionStorage.getItem(FLAG); sessionStorage.removeItem(FLAG); return v; } catch (e) { return null; } };
  BUU.hasKey = () => !!getKey();

  const mkErr = (code, message) => { const e = new Error(message || code); e.code = code; return e; };
  const clone = o => JSON.parse(JSON.stringify(o));
  const net = down => { if (BUU.down !== down) { BUU.down = down; try { window.dispatchEvent(new CustomEvent('buu-net')); } catch (e) { } } };

  /* ---------- เรียก Apps Script (ใช้ text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight) ---------- */
  async function rpc(body) {
    if (!API) throw mkErr('unavailable', 'no api');
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
    let r, j;
    try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal, redirect: 'follow', credentials: 'omit' }); }
    catch (e) { net(true); throw mkErr('unavailable', 'network'); }
    finally { clearTimeout(to); }
    try { j = await r.json(); } catch (e) { net(true); throw mkErr('unavailable', 'bad response'); }
    net(false);
    if (!j || !j.ok) {
      const code = (j && j.code) || 'internal';
      if (code === 'unauthorized' && body.key) { clearKey(); setFlag('unauth'); }
      throw mkErr(code, j && j.message);
    }
    return j;
  }

  /* ---------- ฐานข้อมูลจำลอง: เก็บสำเนาในหน้านี้ แล้วดึงของใหม่เป็นระยะ ---------- */
  const C = {}, subs = new Set();
  let ver = null, loaded = false, inflight = null, timer = 0, failed = 0, started = false, isAdm = false, wDone = 0, pt = 0;
  const colMap = c => C[c] || (C[c] = new Map());
  const fire = col => subs.forEach(s => { if (s.col === col && loaded) s.fire(); });
  const snapDoc = (id, o) => ({ id, exists: !!o, data: () => o ? clone(o) : undefined });
  const qsnap = docs => ({ docs, size: docs.length, empty: !docs.length });
  function runQuery(col, q) {
    let ds = Array.from(colMap(col).entries()).map(([id, o]) => ({ id, o }));
    (q.where || []).forEach(([f, op, v]) => { ds = ds.filter(d => op === '==' ? d.o[f] === v : op === '!=' ? d.o[f] !== v : true); });
    if (q.order) { const [f, dir] = q.order; ds.sort((a, b) => { const x = a.o[f], y = b.o[f]; const r = x === y ? 0 : x == null ? 1 : y == null ? -1 : x < y ? -1 : 1; return dir === 'desc' ? -r : r; }); }
    else ds.sort((a, b) => a.id < b.id ? -1 : 1);
    if (q.limit) ds = ds.slice(0, q.limit);
    return ds.map(d => snapDoc(d.id, d.o));
  }
  function applySnap(data) {
    Object.keys(data).forEach(c => { C[c] = new Map(data[c]); });
    loaded = true;
    Object.keys(data).forEach(fire);
    ['pickups', 'audit'].forEach(c => { if (!data[c]) fire(c); });   /* ไม่ใช่ผู้ดูแล: ส่งชุดว่างให้ผู้ที่รอ */
  }
  async function poll(force) {
    if (inflight) return inflight;
    inflight = (async () => {
      try {
        const t0 = Date.now();
        const j = await rpc({ a: 'snap', ver: force ? null : ver, key: getKey() });
        isAdm = !!j.admin; failed = 0;
        if (t0 < wDone) pollSoon();                       /* คำขอนี้เริ่มก่อนที่เราจะบันทึกสำเร็จ อาจยังไม่มีรายการล่าสุด: ทิ้งผลแล้วดึงใหม่ */
        else if (!j.same) { ver = j.ver; applySnap(j.data); }
      } catch (e) {
        failed++;
        if (e.code === 'unauthorized') { location.reload(); return; }
        if (!loaded) subs.forEach(s => { if (!s.errd && s.error) { s.errd = true; try { s.error(e); } catch (x) { } } });
      } finally { inflight = null; }
    })();
    return inflight;
  }
  function loop() {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if (!document.hidden) await poll(false);
      loop();
    }, Math.min(60000, (isAdm ? 8000 : 20000) * (1 + Math.min(failed, 4))));
  }
  function start() {
    if (started) return; started = true; poll(true).then(loop);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && started) { poll(false); } });
  }
  function pollSoon() { clearTimeout(pt); pt = setTimeout(async () => { if (inflight) await inflight; poll(false); }, 400); }
  BUU.refresh = () => poll(true);
  BUU.retry = () => poll(true);

  const write = async (a, col, id, doc) => {
    const body = { a, col, id, key: getKey() }; if (doc !== undefined) body.doc = doc;
    await rpc(body);
    if (a === 'set') colMap(col).set(id, clone(doc)); else colMap(col).delete(id);   /* แสดงผลทันที ก่อนดึงค่าจริงจากเซิร์ฟเวอร์ */
    wDone = Date.now(); fire(col); pollSoon();
  };
  function docRef(path) {
    const parts = path.split('/'); if (parts.length !== 2) throw new TypeError('bad doc path ' + path);
    const [col, id] = parts;
    return {
      id, path,
      get: async () => { if (!loaded) await poll(true); return snapDoc(id, colMap(col).get(id)); },
      set: async data => { if (!data || typeof data !== 'object' || Array.isArray(data)) throw mkErr('bad_data', 'body must be an object'); await write('set', col, id, clone(data)); },
      update: async () => { throw mkErr('bad_data', 'update not supported'); },
      delete: async () => { await write('del', col, id); },
      onSnapshot(next, error) { return colRef(col).onSnapshot(sn => { const d = sn.docs.find(x => x.id === id); next(d || snapDoc(id, undefined)); }, error); }
    };
  }
  function colRef(col, q) {
    q = q || {};
    const mk = patch => colRef(col, Object.assign({}, q, patch));
    const newId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    return {
      path: col,
      where: (f, op, v) => mk({ where: (q.where || []).concat([[f, op, v]]) }),
      orderBy: (f, dir) => mk({ order: [f, dir || 'asc'] }),
      limit: n => mk({ limit: n }),
      get: async () => { if (!loaded) await poll(true); return qsnap(runQuery(col, q)); },
      doc: id => docRef(col + '/' + (id || newId())),
      add: async o => { const r = docRef(col + '/' + newId()); await r.set(o); return r; },
      onSnapshot(next, error) {
        start();
        const s = { col, error, errd: false, fire: () => setTimeout(() => { if (!s.dead) { try { next(qsnap(runQuery(col, q))); } catch (e) { if (error) error(e); } } }, 0) };
        subs.add(s); if (loaded) s.fire();
        return () => { s.dead = true; subs.delete(s); };
      }
    };
  }
  const db = { doc: docRef, collection: c => colRef(c) };

  /* ---------- ผู้ใช้: ทุกคนเขียนรายการทิ้งได้ ส่วนสิทธิ์ผู้ดูแลมาจากรหัสที่เซิร์ฟเวอร์ยอมรับ ---------- */
  let adminOk = null;
  async function checkAdmin() {
    if (adminOk !== null) return adminOk;
    if (!API || !getKey()) return (adminOk = false);
    try { await rpc({ a: 'auth', key: getKey() }); adminOk = true; }
    catch (e) { adminOk = false; }
    return adminOk;
  }
  const user = { canEdit: () => checkAdmin(), isOwner: () => checkAdmin(), can: async n => n === 'data.write' ? true : null, id: async () => null };

  BUU.login = async (key, remember) => {
    try { await rpc({ a: 'auth', key }); putKey(key, remember); adminOk = true; setFlag('openadmin'); return { ok: true }; }
    catch (e) { return { ok: false, code: e.code || 'unavailable', message: e.message }; }
  };
  BUU.logout = () => { clearKey(); adminOk = false; location.reload(); };

  /* ---------- บันทึกไฟล์: ดาวน์โหลดผ่านเบราว์เซอร์ตามปกติ ---------- */
  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([String(data)], { type: /\.csv$/i.test(filename) ? 'text/csv;charset=utf-8' : 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; a.style.display = 'none'; document.body.appendChild(a); a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 5000);
    }
  };

  window.claude = { use: async name => name === 'db' ? (API ? db : null) : name === 'user' ? user : name === 'downloads' ? downloads : null };
  BUU.ready = true;
})();

</script>

'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const isNum = v => typeof v === 'number' && isFinite(v);

/* ---- safe storage (may throw / be empty in previews) ---- */
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem('buuew.' + k); return v == null ? (mem[k] == null ? null : mem[k]) : v; } catch (e) { return mem[k] == null ? null : mem[k]; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem('buuew.' + k, v); } catch (e) { } },
  del(k) { delete mem[k]; try { localStorage.removeItem('buuew.' + k); } catch (e) { } },
  getJSON(k, d) { try { const v = store.get(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  setJSON(k, v) { store.set(k, JSON.stringify(v)); }
};

/* ---- hashing / random ---- */
function cyrb53(str, seed) {
  let h1 = 0xdeadbeef ^ (seed || 0), h2 = 0x41c6ce57 ^ (seed || 0);
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
const hid = s => cyrb53(String(s) + '|buu-ewaste', 7).toString(36);
function rng(seed) { // mulberry32
  let a = (seed >>> 0) || 1;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---- time (fixed UTC+7 so every device groups days the same way) ---- */
const TZ = 7 * 3600e3, DAY = 86400e3;
const dayKey = t => new Date(t + TZ).toISOString().slice(0, 10);
const dayStart = t => Math.floor((t + TZ) / DAY) * DAY - TZ;
const hourOf = t => new Date(t + TZ).getUTCHours();
const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_DOW = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
function dparts(t) { const d = new Date(t + TZ); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), w: d.getUTCDay(), H: d.getUTCHours(), M: d.getUTCMinutes() }; }
const p2 = n => String(n).padStart(2, '0');
const fmtDate = t => { const p = dparts(t); return p.d + ' ' + TH_MON[p.m] + ' ' + (p.y + 543); };
const fmtDateShort = t => { const p = dparts(t); return p.d + ' ' + TH_MON[p.m]; };
const fmtTime = t => { const p = dparts(t); return p2(p.H) + ':' + p2(p.M) + ' น.'; };
const fmtDT = t => fmtDate(t) + ' · ' + fmtTime(t);
function ago(t, now) {
  const s = Math.max(0, Math.floor(((now || Date.now()) - t) / 1000));
  if (s < 60) return 'เมื่อสักครู่';
  if (s < 3600) return Math.floor(s / 60) + ' นาทีที่แล้ว';
  if (s < 86400) return Math.floor(s / 3600) + ' ชั่วโมงที่แล้ว';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' วันที่แล้ว';
  return fmtDate(t);
}
/* ---- numbers ---- */
const kg = (v, d) => { v = num(v); d = d == null ? (v >= 100 ? 0 : v >= 10 ? 1 : 2) : d; return v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: d }); };
const kg1 = v => num(v).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

let toastTimer = 0;

/* ---- confirm dialog (no window.confirm in sandboxed pages) ---- */
function askConfirm(title, body, okLabel, danger) {
  return new Promise(res => {
    const m = openModal('<h3 class="mh">' + esc(title) + '</h3><p class="mp">' + body + '</p><div class="mbtns"><button class="btn ghost" data-act="cf-no">ยกเลิก</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-act="cf-yes" autofocus>' + esc(okLabel || 'ตกลง') + '</button></div>', { label: title, cls: 'small' });
    const done = v => { m.removeEventListener('click', on); document.removeEventListener('keydown', onk, true); res(v); closeModal(); };
    const on = e => { const b = e.target.closest('[data-act]'); if (!b) return; if (b.dataset.act === 'cf-yes') { e.stopPropagation(); done(true); } if (b.dataset.act === 'cf-no') { e.stopPropagation(); done(false); } };
    const onk = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    m.addEventListener('click', on); document.addEventListener('keydown', onk, true);
    $('#modal-root .scrim').addEventListener('click', e => { e.stopPropagation(); done(false); }, { once: true });
  });
}

async function saveFile(filename, data) {
  const dl = await getDownloads();
  if (!dl) {
    if (data && data.type && /^image\//.test(data.type)) { const url = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(null); fr.readAsDataURL(data); }); if (url) { showImage(url, filename); return false; } }
    toast('เครื่องนี้ยังบันทึกไฟล์จากหน้านี้ไม่ได้', 'err'); return false;
  }

  catch (e) { if (e && e.code === 'declined') return false; toast('บันทึกไฟล์ไม่สำเร็จ (' + ((e && e.code) || 'error') + ')', 'err'); return false; }

/* ---- canvas text wrapping that understands Thai (no spaces between words) ---- */
let _seg;
function wrapText(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(par => {
    let tokens;
    try { _seg = _seg || new Intl.Segmenter('th', { granularity: 'word' }); tokens = Array.from(_seg.segment(par), s => s.segment); }
    catch (e) { tokens = par.match(/[฀-๿]+|\s+|[^\s฀-๿]+/g) || [par]; }
    let line = '';
    tokens.forEach(tk => {
      const t = line + tk;
      if (ctx.measureText(t).width <= maxW || !line) { line = t; }
      else {
        // an oversized single token (rare) is split by character
        out.push(line.trimEnd()); line = tk.trimStart();
        while (ctx.measureText(line).width > maxW && line.length > 1) {
          let i = line.length - 1; while (i > 1 && ctx.measureText(line.slice(0, i)).width > maxW) i--;
          while (i > 1 && /[ัิ-ฺ็-๎]/.test(line[i])) i--; // never split before a Thai mark
          out.push(line.slice(0, i)); line = line.slice(i);
        }
      }
    });
    out.push(line.trimEnd());
  });
  return out;
}

class MemDB {

  _c(n) { return this.cols[n] || (this.cols[n] = new Map()); }
  _save() { if (!this.pk) return; const o = {}; Object.keys(this.cols).forEach(c => { o[c] = Object.fromEntries(this.cols[c]); }); store.setJSON(this.pk, o); }
  _fire(c) { this.subs.forEach(s => { if (s.c === c) s.run(); }); }
  _snap(c, ord, lim) {
    let ds = Array.from(this._c(c).entries()).map(([id, o]) => ({ id, o }));
    if (ord) { const [f, dir] = ord; ds.sort((a, b) => { const x = a.o[f], y = b.o[f]; const r = x === y ? 0 : x == null ? 1 : y == null ? -1 : x < y ? -1 : 1; return dir === 'desc' ? -r : r; }); }
    else ds.sort((a, b) => a.id < b.id ? -1 : 1);
    if (lim) ds = ds.slice(0, lim);
    const docs = ds.map(d => ({ id: d.id, exists: true, data: () => JSON.parse(JSON.stringify(d.o)) }));
    return { docs, size: docs.length, empty: !docs.length };
  }
  collection(c, ord, lim) {
    const db = this;
    return {
      orderBy: (f, d) => db.collection(c, [f, d || 'asc'], lim), limit: n => db.collection(c, ord, n),
      get: () => Promise.resolve(db._snap(c, ord, lim)),
      doc: id => db.doc(c + '/' + (id || rid())),
      add: async o => { const r = db.doc(c + '/' + rid()); await r.set(o); return r; },
      onSnapshot(next) { const s = { c, run: () => Promise.resolve().then(() => { if (!s.dead) next(db._snap(c, ord, lim)); }) }; db.subs.push(s); s.run(); return () => { s.dead = true; db.subs = db.subs.filter(x => x !== s); }; }
    };
  }
  doc(path) {
    const [c, id] = path.split('/'), db = this;
    return {
      id, path,
      set: async o => { db._c(c).set(id, JSON.parse(JSON.stringify(o))); db._save(); db._fire(c); },
      delete: async () => { db._c(c).delete(id); db._save(); db._fire(c); },
      get: async () => { const o = db._c(c).get(id); return { id, exists: !!o, data: () => o && JSON.parse(JSON.stringify(o)) }; }
    };
  }
}

class MapView {

      '<div class="map-ctl"><button type="button" data-z="in" aria-label="ซูมเข้า">' + icon('plus') + '</button><button type="button" data-z="out" aria-label="ซูมออก">' + icon('minus') + '</button><button type="button" data-z="fit" aria-label="ดูทั้งแผนที่">' + icon('fit') + '</button></div>' +
      '<div class="map-credit">แผนที่: มหาวิทยาลัยบูรพา</div>';

    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.up(e, true));
    el.addEventListener('wheel', e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); const r = el.getBoundingClientRect(); this.zoomAt(this.k * Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    el.addEventListener('dblclick', e => { if (e.target.closest('.pin,.map-ctl')) return; const r = el.getBoundingClientRect(); this.zoomAt(this.k * 1.8, e.clientX - r.left, e.clientY - r.top, true); });
    el.addEventListener('click', e => { const z = e.target.closest('[data-z]'); if (z) { const c = z.dataset.z; if (c === 'fit') this.fit(true); else this.zoomAt(this.k * (c === 'in' ? 1.5 : 1 / 1.5), this.W / 2, this.H / 2, true); return; } const p = e.target.closest('.pin'); if (p && this.o.onPick) this.o.onPick(p.dataset.id); });
    el.addEventListener('keydown', e => { const s = 60; if (e.target.closest('.pin') && e.key !== 'Escape') return; if (e.key === 'ArrowLeft') this.pan(s, 0); else if (e.key === 'ArrowRight') this.pan(-s, 0); else if (e.key === 'ArrowUp') this.pan(0, s); else if (e.key === 'ArrowDown') this.pan(0, -s); else if (e.key === '+' || e.key === '=') this.zoomAt(this.k * 1.3, this.W / 2, this.H / 2, true); else if (e.key === '-') this.zoomAt(this.k / 1.3, this.W / 2, this.H / 2, true); else return; e.preventDefault(); });

  }
  destroy() { if (this.ro) this.ro.disconnect(); }
  resize(first) {
    const r = this.el.getBoundingClientRect(); const W = r.width, H = r.height; if (!W || !H) return;
    const had = this.W > 0, cx = had ? (this.W / 2 - this.tx) / this.k : MAP.w / 2, cy = had ? (this.H / 2 - this.ty) / this.k : MAP.h / 2, rel = had ? this.k / this.k0 : 1;
    this.W = W; this.H = H; this.k0 = Math.min(W / MAP.w, H / MAP.h); this.kmin = this.k0 * 0.98; this.kmax = Math.max(this.k0 * 5, 3);
    if (!had || first) { this.k = this.k0; this.tx = (W - MAP.w * this.k) / 2; this.ty = (H - MAP.h * this.k) / 2; }
    else { this.k = clamp(this.k0 * rel, this.kmin, this.kmax); this.tx = W / 2 - cx * this.k; this.ty = H / 2 - cy * this.k; }

  }
  clampT() {
    const w = MAP.w * this.k, h = MAP.h * this.k;

  }
  placePins() { const k = this.k, tx = this.tx, ty = this.ty; this.pinEls.forEach(el => { el.style.transform = 'translate(' + (el._x * k + tx).toFixed(1) + 'px,' + (el._y * k + ty).toFixed(1) + 'px)'; }); }
  setPins(list) {
    const keep = new Set(); const sel = this.o.selected;
    list.forEach(p => {
      keep.add(p.id); let el = this.pinEls.get(p.id);
      if (!el) { el = document.createElement('button'); el.type = 'button'; el.dataset.id = p.id; this.pinsEl.appendChild(el); this.pinEls.set(p.id, el); }
      el._x = p.x; el._y = p.y;
      const cls = 'pin ' + (p.cls || '') + (sel === p.id ? ' sel' : '');
      const sig = cls + '|' + (p.label || '') + '|' + p.name;

      }
      el.style.zIndex = sel === p.id ? 5 : (p.z || 1);
    });
    this.pinEls.forEach((el, id) => { if (!keep.has(id)) { el.remove(); this.pinEls.delete(id); } });
    this.placePins();
  }
  select(id) { this.o.selected = id; this.pinEls.forEach((el, pid) => el.classList.toggle('sel', pid === id)); }
  /* ---- gestures ---- */
  down(e) {
    if (e.target.closest('.map-ctl') || e.target.closest('.pin')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    this.moved = 0; this.stopAnim();

    this.el.classList.add('grab');
  }
  move(e) {
    const p = this.ptr.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; this.moved += Math.abs(dx) + Math.abs(dy);
    if (this.ptr.size === 1) { this.tx += dx; this.ty += dy; this.apply(); }
    else if (this.ptr.size === 2) {
      const [a, b] = [...this.ptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = this.el.getBoundingClientRect();
      const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      if (this.d0 > 0) this.zoomAt(this.k00 * d / this.d0, mx, my); else this.d0 = d;
    }
  }
  up(e, cancel) {
    const p = this.ptr.get(e.pointerId); this.ptr.delete(e.pointerId);
    if (!this.ptr.size) this.el.classList.remove('grab');
    if (this.ptr.size === 1) { const q = [...this.ptr.values()][0]; q.x0 = q.x; q.y0 = q.y; }
    if (p && !cancel && this.moved < 7 && Date.now() - p.t0 < 600 && this.o.onTap && this.ptr.size === 0) {
      const r = this.el.getBoundingClientRect(); this.o.onTap((e.clientX - r.left - this.tx) / this.k, (e.clientY - r.top - this.ty) / this.k);
    }
  }
  pan(dx, dy) { this.tx += dx; this.ty += dy; this.apply(); }
  zoomAt(nk, cx, cy, anim) {
    nk = clamp(nk, this.kmin, this.kmax);
    const mx = (cx - this.tx) / this.k, my = (cy - this.ty) / this.k;

  }
  fit(anim) { this.go(this.k0, (this.W - MAP.w * this.k0) / 2, (this.H - MAP.h * this.k0) / 2, anim); }

  }
  go(k, tx, ty, anim) {

    this.raf = requestAnimationFrame(step);
  }

}

function trendOf(sc) {

function fillPts() {
  const D = Store.D, B = D.bins, cnt = { all: D.pts.length, due: 0, near: 0, off: 0 };
  D.pts.forEach(p => { const l = B[p.id].lv; if (LV[l] >= LV.due) cnt.due++; else if (l === 'near') cnt.near++; if (!p.on) cnt.off++; });
  const ck = $('#a-chips'); if (!ck) return;
  ck.innerHTML = '<div class="filters wrap"><div class="chips" role="group" aria-label="กรองจุดรับ">' + [['all', 'ทั้งหมด'], ['due', 'ถึงกำหนด'], ['near', 'ใกล้เต็ม'], ['off', 'ปิดรับ']].map(c => '<button class="chip' + (AS.pf === c[0] ? ' on' : '') + '" data-act="a-pf" data-f="' + c[0] + '" aria-pressed="' + (AS.pf === c[0]) + '">' + c[1] + ' <b>' + cnt[c[0]] + '</b></button>').join('') + '</div><span class="sp"></span>' +
    '<label class="fsel"><span class="sr">เรียงตาม</span><select class="inp sm" data-chg="a-ps" aria-label="เรียงตาม"><option value="ratio"' + (AS.ps === 'ratio' ? ' selected' : '') + '>เต็มมากสุดก่อน</option><option value="last"' + (AS.ps === 'last' ? ' selected' : '') + '>ไม่ได้เก็บนานสุดก่อน</option><option value="name"' + (AS.ps === 'name' ? ' selected' : '') + '>ชื่อ ก-ฮ</option></select></label>' +
    '<button class="btn sm primary" data-act="pt-new">' + icon('plus') + 'เพิ่มจุดรับ</button></div>';
  let L = D.pts.filter(p => AS.pf === 'all' || (AS.pf === 'due' && LV[B[p.id].lv] >= LV.due) || (AS.pf === 'near' && B[p.id].lv === 'near') || (AS.pf === 'off' && !p.on));
  if (AS.ps === 'name') L.sort((a, b) => a.n.localeCompare(b.n, 'th')); else if (AS.ps === 'last') L.sort((a, b) => (B[a.id].last || 0) - (B[b.id].last || 0)); else L.sort(byLevel);
  $('#a-plist').innerHTML = L.length ? '<ul class="plist-a">' + L.map(ptRow).join('') + '</ul>' : '<section class="card center empty">' + icon('check', 'xl') + '<h3>' + (AS.pf === 'due' ? 'ไม่มีจุดที่ถึงกำหนดเก็บ' : 'ไม่มีจุดรับในหมวดนี้') + '</h3></section>';
}

const fileTag = () => (Store.src === 'sample' ? '-sample' : '') + '-' + dayKey(Date.now());

/* ============ LEDGER ============ */
function ledgerFilter() {
  const D = Store.D, q = AS.lq.trim().toLowerCase();
  return D.drops.filter(d => {
    if (AS.lpt && d.pt !== AS.lpt) return false;
    if (AS.lty && !d.it[AS.lty]) return false;
    if (AS.lst === 'void' && !d.void) return false;
    if (AS.lst === 'ok' && d.void) return false;
    if (AS.lst === 'fix' && !d.fixed) return false;
    if (AS.lsg !== '' && (d.void || (d.st || 0) !== +AS.lsg)) return false;
    if (q && !(ptName(d.pt) + ' ' + code(d.pt) + ' ' + typeLine(d.it) + ' ' + d.id).toLowerCase().includes(q)) return false;
    return true;
  });
}
function fillLedger() {
  const sumEl = $('#l-sum'); if (!sumEl) return;
  const list = ledgerFilter(), pages = Math.max(1, Math.ceil(list.length / PAGE)); AS.lpage = clamp(AS.lpage, 0, pages - 1);
  const sm = Store.sum(list);
  sumEl.textContent = 'พบ ' + int(list.length) + ' รายการ · รวม ' + kg1(sm.kg) + ' กก.' + (list.some(d => d.void) ? ' (ไม่นับที่ยกเลิก)' : '');
  const slice = list.slice(AS.lpage * PAGE, AS.lpage * PAGE + PAGE);
  $('#l-list').innerHTML = slice.length ? slice.map(ledgerRow).join('') : '<li class="empty-s">ไม่พบรายการที่ตรงกับตัวกรอง</li>';
  $('#l-pager').innerHTML = pages > 1 ? '<div class="pager"><button class="btn xs ghost" data-act="l-page" data-d="-1"' + (AS.lpage ? '' : ' disabled') + '>' + icon('back') + 'ก่อนหน้า</button><span class="small muted">หน้า ' + (AS.lpage + 1) + ' / ' + pages + '</span><button class="btn xs ghost" data-act="l-page" data-d="1"' + (AS.lpage < pages - 1 ? '' : ' disabled') + '>ถัดไป' + icon('chev') + '</button></div>' : '';
}
ACT['l-page'] = el => { AS.lpage += +el.dataset.d; fillLedger(); const s = $('#l-sum'); if (s) s.scrollIntoView({ block: 'start', behavior: 'smooth' }); };
INP['l-q'] = el => { AS.lq = el.value; AS.lpage = 0; fillLedger(); };

ACT['csv-drops'] = async () => {
  const list = ledgerFilter(), idx = {}; let n = 0;
  const rows = [['รหัสรายการ', 'เวลา', 'รหัสจุด', 'จุดรับ'].concat(TYPES.map(t => t.n + ' (' + t.cl + ')'), ['ชิ้นรวม', 'น้ำหนักที่แจ้ง (กก.)', 'ที่มาของน้ำหนัก', 'น้ำหนักที่ใช้ (กก.)', 'สถานะรายการ', 'ขั้นตอน', 'กลุ่มผู้ทิ้ง', 'ผู้ทิ้ง (ลำดับนิรนาม)'])];
  list.slice().sort((a, b) => a.t - b.t).forEach(d => {
    if (!idx[d.h]) idx[d.h] = 'U' + String(++n).padStart(3, '0');
    rows.push([d.id, stamp(d.t), d.pt.toUpperCase(), ptName(d.pt)].concat(TYPES.map(t => d.it[t.k] || 0), [d.q, d.w, d.ws === 'u' ? 'ผู้ทิ้งชั่งเอง' : 'ประมาณ', d.we, d.void ? 'ยกเลิก' : d.fixed ? 'แก้น้ำหนัก' : 'ปกติ', d.void ? '' : STAGES[d.st || 0].n, d.rl ? ROLE[d.rl] : '', idx[d.h]]));
  });

  return '<li class="rnd"><div class="rd-h"><div><b>' + esc(p ? p.n : 'จุดรับที่ถูกลบแล้ว') + '</b><small>' + esc(fmtDT(r.t)) + ' · ' + int(r.n) + ' รายการ</small></div>' + (b ? '<span class="tag ' + (st >= 4 ? '' : 'blue') + '">' + esc(STAGES[st].n) + '</span>' : '<span class="tag grey">ไม่พบสถานะ</span>') + '</div>' +

    (b ? pipeHtml(st) : '') +
    '<p class="small muted mt8">' + [r.by ? 'ผู้เก็บ: ' + esc(r.by) : '', r.dest ? 'ส่งต่อไป: ' + esc(r.dest) : '', r.note ? 'หมายเหตุ: ' + esc(r.note) : ''].filter(Boolean).join(' · ') + '</p>' +

}

function qrCached(id) {
  const url = QrUI.link(id); if (!url) return null;
  if (!AS.qrc[url]) { try { AS.qrc[url] = { url, qr: QR.encode(url, ['Q', 'M', 'L']) }; } catch (e) { AS.qrc[url] = { url, err: e.message }; } }
  return AS.qrc[url];
}

/* ============ 75_charts.js — small dependency-free charts for the back office ============
   Rules followed: one axis · thin marks (≤24px, 4px round data-end, square baseline) · 2px gap between bars ·
   hairline solid grid · text in text tokens (never the series colour) · crosshair/tooltip (textContent only) ·
   keyboard focus shows the same tooltip · every chart has a table twin (built by Viz.table) */
'use strict';
const Viz = {
  _tip: null,
  nf(v) { return Number(v).toLocaleString('en-US', { maximumFractionDigits: 3 }); },
  tipEl() {
    if (this._tip && this._tip.isConnected) return this._tip;
    const el = document.createElement('div'); el.className = 'vtip'; el.hidden = true; el.setAttribute('aria-hidden', 'true');
    (document.getElementById('admin') || document.body).appendChild(el); return (this._tip = el);
  },
  /* c = { h: header, rows: [{k: colour, v: value, u: unit}], s: sub-line } — all inserted with textContent */
  showTip(c, cx, cy) {
    const el = this.tipEl(); el.textContent = '';
    const add = (cls, txt, parent) => { const d = document.createElement('div'); d.className = cls; if (txt != null) d.textContent = txt; (parent || el).appendChild(d); return d; };
    if (c.h) add('vt-h', c.h);
    (c.rows || []).forEach(r => {
      const row = add('vt-r');
      if (r.k) { const k = document.createElement('i'); k.style.background = r.k; row.appendChild(k); }
      const v = document.createElement('b'); v.textContent = r.v; row.appendChild(v);
      if (r.u) { const u = document.createElement('span'); u.textContent = r.u; row.appendChild(u); }
    });
    if (c.s) add('vt-s', c.s);
    el.hidden = false;
    const w = el.offsetWidth, h = el.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    let x = cx + 14, y = cy - h - 14;
    if (x + w > vw - 8) x = cx - w - 14;
    if (x < 8) x = Math.max(8, (vw - w) / 2);
    if (y < 8) y = cy + 18;
    if (y + h > vh - 8) y = Math.max(8, vh - h - 8);
    el.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
  },
  hideTip() { if (this._tip) this._tip.hidden = true; },

  /* clean axis: top tick ≥ max, ≤ ~4 intervals */
  scale(v) {
    if (!(v > 0)) return { max: 1, ticks: [0, 1], step: 1 };
    const raw = v / 3.2, p = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw - 1e-12);
    const max = +(Math.ceil(v / step - 1e-9) * step).toPrecision(12), ticks = [];
    for (let i = 0; i * step <= max + 1e-9; i++) ticks.push(+(i * step).toPrecision(12));
    return { max, ticks, step };
  },

  /* vertical columns over an ordered axis (time).
     sp = { data:[{label, v}], tip:(d,i)=>content, color, h, aria, peakFmt } */
  columns(host, sp) {
    const d = sp.data, n = d.length, W = Math.max(280, Math.floor(host.clientWidth) || 320), H = sp.h || 200;
    const m = { l: 40, r: 10, t: 20, b: 28 }, pw = W - m.l - m.r, ph = H - m.t - m.b, y0 = m.t + ph;
    const vmax = d.reduce((a, x) => Math.max(a, x.v), 0), sc = this.scale(vmax), slot = pw / Math.max(1, n), bw = clamp(slot - 2, 1.5, 24);
    const cx = i => m.l + slot * i + slot / 2, Y = v => m.t + ph - (v / sc.max) * ph, f1 = v => v.toFixed(1);
    let s = '<svg class="vsvg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(sp.aria || '') + '" style="--vc:' + (sp.color || 'var(--accent)') + '">';
    sc.ticks.forEach(t => { const y = Y(t); s += '<line class="' + (t === 0 ? 'axis' : 'grid') + '" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + f1(y) + '" y2="' + f1(y) + '"/><text x="' + (m.l - 8) + '" y="' + f1(y + 4) + '" text-anchor="end">' + esc(this.nf(t)) + '</text>'; });
    const r = Math.min(4, bw / 2);
    d.forEach((x, i) => {
      if (!(x.v > 0)) return;
      const h = Math.max(1.5, y0 - Y(x.v)), xx = cx(i) - bw / 2, rr = Math.min(r, h), yt = y0 - h;
      s += '<path class="bar" data-i="' + i + '" d="M' + f1(xx) + ',' + f1(y0) + 'V' + f1(yt + rr) + 'Q' + f1(xx) + ',' + f1(yt) + ' ' + f1(xx + rr) + ',' + f1(yt) + 'H' + f1(xx + bw - rr) + 'Q' + f1(xx + bw) + ',' + f1(yt) + ' ' + f1(xx + bw) + ',' + f1(yt + rr) + 'V' + f1(y0) + 'Z"/>';
    });
    const every = Math.max(1, Math.ceil(64 / slot));
    for (let i = n - 1; i >= 0; i -= every) { const x = cx(i), anc = x < m.l + 22 ? 'start' : x > W - m.r - 22 ? 'end' : 'middle'; s += '<text x="' + f1(anc === 'start' ? Math.max(m.l, x - bw / 2) : x) + '" y="' + (H - 8) + '" text-anchor="' + anc + '">' + esc(d[i].label) + '</text>'; }
    if (vmax > 0 && n > 1) {
      let pi = 0; d.forEach((x, i) => { if (x.v > d[pi].v) pi = i; });
      const px = cx(pi), anc = px < m.l + 18 ? 'start' : px > W - m.r - 18 ? 'end' : 'middle';
      s += '<text class="peak" x="' + f1(px) + '" y="' + f1(Y(d[pi].v) - 6) + '" text-anchor="' + anc + '">' + esc(sp.peakFmt ? sp.peakFmt(d[pi]) : this.nf(d[pi].v)) + '</text>';
    }
    s += '<line class="guide" x1="0" x2="0" y1="' + m.t + '" y2="' + y0 + '" visibility="hidden"/>';
    s += '<rect class="hit" x="' + m.l + '" y="0" width="' + pw + '" height="' + y0 + '" fill="transparent" tabindex="0" role="group" aria-label="' + esc((sp.aria || 'กราฟ') + ' · ใช้ปุ่มลูกศรซ้ายขวาเพื่อดูค่าแต่ละช่วง') + '"/></svg>';
    host.innerHTML = s;
    const svg = host.firstElementChild, guide = svg.querySelector('.guide'), hit = svg.querySelector('.hit'); let cur = -1;
    const show = i => {
      i = clamp(i, 0, n - 1);
      if (i !== cur) { svg.querySelectorAll('.bar.on').forEach(b => b.classList.remove('on')); const b = svg.querySelector('.bar[data-i="' + i + '"]'); if (b) b.classList.add('on'); cur = i; }
      const x = cx(i); guide.setAttribute('x1', x); guide.setAttribute('x2', x); guide.setAttribute('visibility', 'visible');
      const rc = svg.getBoundingClientRect(), k = rc.width / W;
      this.showTip(sp.tip(d[i], i), rc.left + x * k, rc.top + Y(Math.max(d[i].v, vmax * 0.04)) * k);
    };
    const hide = () => { cur = -1; guide.setAttribute('visibility', 'hidden'); svg.querySelectorAll('.bar.on').forEach(b => b.classList.remove('on')); this.hideTip(); };
    const at = e => { const rc = svg.getBoundingClientRect(), k = rc.width / W; show(Math.floor(((e.clientX - rc.left) / k - m.l) / slot)); };
    hit.addEventListener('pointermove', at); hit.addEventListener('pointerdown', at);
    hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); else setTimeout(hide, 2200); });
    hit.addEventListener('focus', () => show(cur < 0 ? n - 1 : cur)); hit.addEventListener('blur', hide);
    hit.addEventListener('keydown', e => {
      const k = e.key; let i = cur < 0 ? n - 1 : cur;
      if (k === 'ArrowLeft') i--; else if (k === 'ArrowRight') i++; else if (k === 'Home') i = 0; else if (k === 'End') i = n - 1; else if (k === 'Escape') { hide(); return; } else return;
      e.preventDefault(); show(i);
    });
  },

  /* horizontal bars for categories. rows = [{label, icon, v, val, sub, color, tip}] */
  hbars(host, rows, sp) {
    sp = sp || {};
    const max = rows.reduce((a, r) => Math.max(a, r.v), 0) || 1;
    host.innerHTML = '<ul class="hb">' + rows.map((r, i) => '<li class="hb-r" tabindex="0" data-i="' + i + '"><div class="hb-h"><span class="hb-l">' + (r.icon ? icon(r.icon) : '') + '<span>' + esc(r.label) + '</span></span><span class="hb-v"><b>' + esc(r.val) + '</b>' + (r.sub ? ' <small>' + esc(r.sub) + '</small>' : '') + '</span></div><div class="hb-t"><i style="width:' + (r.v > 0 ? Math.max(1.2, r.v / max * 100) : 0).toFixed(1) + '%;background:' + (r.color || sp.color || 'var(--accent)') + '"></i></div></li>').join('') + '</ul>';
    host.querySelectorAll('.hb-r').forEach((el, i) => {
      const r = rows[i], put = (x, y) => { if (r.tip) this.showTip(r.tip, x, y); };
      el.addEventListener('pointermove', e => put(e.clientX, e.clientY));
      el.addEventListener('pointerdown', e => put(e.clientX, e.clientY));
      el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') this.hideTip(); else setTimeout(() => this.hideTip(), 2200); });
      el.addEventListener('focus', () => { const rc = el.getBoundingClientRect(); put(rc.left + rc.width * 0.5, rc.top + 6); });
      el.addEventListener('blur', () => this.hideTip());
    });
  },

  /* accessible twin of any chart */
  table(cols, rows, cap) {
    return '<div class="vtab-w"><table class="vtab"><caption class="sr">' + esc(cap || '') + '</caption><thead><tr>' + cols.map((c, i) => '<th scope="col"' + (i ? ' class="r"' : '') + '>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
      rows.map(r => '<tr>' + r.map((c, i) => i ? '<td class="r tnum">' + esc(c) + '</td>' : '<th scope="row">' + esc(c) + '</th>').join('') + '</tr>').join('') + '</tbody></table></div>';
  }
};

/* ============ 80_scan.js — scan a point's QR: live camera (when the page may use it) → photo → typed code ============ */
'use strict';
const Scan = {
  stream: null, raf: 0, bd: null, busy: false, last: 0,
  parse(text) {
    const t = String(text || '').trim();
    const m = /#(p\d{2}|c[a-z0-9_]{1,23})\s*$/i.exec(t) || /^(?:buuew[:\/])?(p\d{2}|c[a-z0-9_]{1,23})$/i.exec(t);
    return m ? m[1].toLowerCase() : null;
  },
  normCode(s) {
    s = String(s || '').trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '');
    if (/^\d{1,2}$/.test(s)) s = 'p' + s.padStart(2, '0');
    if (/^p\d{1,2}$/.test(s)) s = 'p' + s.slice(1).padStart(2, '0');
    return s;
  },
  handle(text, manual) {
    const id = manual ? this.normCode(text) : this.parse(text);
    if (!id) { this.msg('QR นี้ไม่ใช่ของ BUU E-Waste ลองสแกนที่ถังอีกครั้ง', true); return false; }
    if (!ptOf(id)) { this.msg('ไม่พบจุดรับรหัส ' + id.toUpperCase() + ' ในระบบ', true); return false; }
    this.stop(); closeModal(); go('drop', { pt: id, viaQR: true }); toast('เลือกจุด ' + ptName(id) + ' ให้แล้ว');
    return true;
  },
  msg(t, bad) { const el = $('#scan-msg'); if (el) { el.textContent = t; el.className = 'scan-msg' + (bad ? ' bad' : ''); } },
  open() {
    const html = '<button class="ibtn mclose" data-act="modal-close" aria-label="ปิด">' + icon('close') + '</button><h3 class="mh">สแกน QR ที่ถัง</h3><p class="mp">สแกนแล้วระบบจะเลือกจุดรับให้เอง ไม่ต้องกรอกเอง</p>' +
      '<div class="scanbox" id="scanbox" hidden><video id="sv" playsinline muted></video><div class="scanframe"><i></i><i></i><i></i><i></i></div></div>' +
      '<p class="scan-msg" id="scan-msg" role="status">กำลังเปิดกล้อง…</p>' +
      '<div class="row gap8 wrap mt12"><label class="btn soft"><input type="file" accept="image/*" capture="environment" id="scan-cam" class="sr">' + icon('camera') + 'ถ่ายรูป QR</label><label class="btn ghost"><input type="file" accept="image/*" id="scan-file" class="sr">' + icon('image') + 'เลือกรูปจากเครื่อง</label></div>' +
      '<div class="manual mt16"><label class="f" for="scan-code">หรือพิมพ์รหัสจุด (อยู่ใต้ QR เช่น P03)</label><div class="row gap8"><input id="scan-code" class="inp" placeholder="P03" autocomplete="off" autocapitalize="characters" maxlength="24"><button class="btn primary" id="scan-ok">ไปต่อ</button></div></div>' +
      '<p class="hint mt12">เคล็ดลับ: ใช้แอปกล้องของมือถือสแกน QR ที่ถังได้เลย จะเปิดหน้านี้พร้อมเลือกจุดให้อัตโนมัติ</p>';
    const m = openModal(html, { label: 'สแกน QR', cls: 'wide' });
    const onFile = async e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return; this.msg('กำลังอ่าน QR จากรูป…'); const t = await this.fromFile(f); if (t) this.handle(t); else this.msg('อ่าน QR ในรูปนี้ไม่ได้ ลองถ่ายให้ใกล้และตรงขึ้น หรือพิมพ์รหัสจุดด้านล่าง', true); };
    $('#scan-cam', m).addEventListener('change', onFile); $('#scan-file', m).addEventListener('change', onFile);
    const go_ = () => this.handle($('#scan-code', m).value, true);
    $('#scan-ok', m).addEventListener('click', go_); $('#scan-code', m).addEventListener('keydown', e => { if (e.key === 'Enter') go_(); });
    this.startCamera();
  },
  /* the page's frame may not be allowed to open the camera: the photo button (phone camera app) is then the way in */
  noLive() {
    this.msg('กล้องสดเปิดในหน้านี้ไม่ได้ กด “ถ่ายรูป QR” เพื่อถ่ายด้วยแอปกล้องของเครื่อง ระบบจะอ่านรหัสจากรูปให้เอง หรือพิมพ์รหัสจุดด้านล่าง');
    const b = $('#scan-cam') && $('#scan-cam').closest('label'); if (b) b.className = 'btn primary';
  },
  canDecode() { return ('BarcodeDetector' in window) || (typeof QRDec !== 'undefined'); },
  async startCamera() {
    const md = navigator.mediaDevices, box = $('#scanbox'), v = $('#sv');
    if (!md || !md.getUserMedia || !v || !this.canDecode()) return this.noLive();
    try { this.stream = await md.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false }); }
    catch (e) { return this.noLive(); }
    if (!modalOpen()) { this.stop(); return; }
    v.srcObject = this.stream; try { await v.play(); } catch (e) { }
    box.hidden = false; this.msg('เล็งกล้องไปที่ QR ของจุดรับ'); this.loop(v);
  },
  loop(v) {
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
    const tick = async () => {
      if (!this.stream) return; this.raf = requestAnimationFrame(tick);
      const now = performance.now(); if (this.busy || now - this.last < 140 || v.readyState < 2) return; this.busy = true; this.last = now;
      try { const s = Math.min(1, 720 / (v.videoWidth || 720)); cv.width = Math.round(v.videoWidth * s); cv.height = Math.round(v.videoHeight * s); ctx.drawImage(v, 0, 0, cv.width, cv.height); const t = await this.detect(cv, ctx, false); if (t && this.stream) this.handle(t); } catch (e) { }
      this.busy = false;
    };
    this.raf = requestAnimationFrame(tick);
  },
  stop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; } },
  /* live frames: the browser's own BarcodeDetector when it works, else our decoder (light-on-dark passes only every 3rd frame).
     still photos: try both */
  async detect(cv, ctx, still) {
    if ('BarcodeDetector' in window && !this.bdBad) {
      try { this.bd = this.bd || new BarcodeDetector({ formats: ['qr_code'] }); const r = await this.bd.detect(cv); if (r && r[0] && r[0].rawValue) return r[0].rawValue; if (!still) return null; }
      catch (e) { this.bd = null; this.bdBad = true; }
    }
    if (typeof QRDec !== 'undefined') { const im = (ctx || cv.getContext('2d')).getImageData(0, 0, cv.width, cv.height); this.frames = (this.frames || 0) + 1; return QRDec.decode(im.data, im.width, im.height, still ? undefined : { invert: this.frames % 3 === 0 }); }
    return null;
  },
  async fromFile(f) {
    let bmp; try { bmp = await createImageBitmap(f); } catch (e) { bmp = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = URL.createObjectURL(f); }); }
    if (!bmp) return null; const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight; if (!w0 || !h0) return null;
    for (const maxW of [1000, 1600, 640, 420]) {
      const s = Math.min(1, maxW / Math.max(w0, h0)), cv = document.createElement('canvas'); cv.width = Math.round(w0 * s); cv.height = Math.round(h0 * s); const ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
      try { const t = await this.detect(cv, ctx, true); if (t) return t; } catch (e) { }
    }
    return null;
  }
};
ACT.scan = () => Scan.open();

/* ============ 85_standalone.js — only used by the standalone (Google Sheets) build: admin login / logout ============ */
'use strict';
if (window.BUU) {
  function openLogin() {
    if (Store.isAdmin) { Admin.open(); return; }
    openModal('<button class="ibtn mclose" data-act="modal-close" aria-label="ปิด">' + icon('close') + '</button><h3 class="mh">เข้าสู่ระบบผู้ดูแล</h3><p class="mp">ใส่รหัสผู้ดูแลที่ตั้งไว้ใน Code.gs (ADMIN_KEY) เพื่อเปิดหลังบ้าน คนทั่วไปไม่ต้องใส่รหัส สามารถทิ้ง E-Waste ได้ตามปกติ</p>' +
      '<div class="fld"><label class="f" for="al-key">รหัสผู้ดูแล</label><input id="al-key" class="inp" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus></div>' +
      '<label class="swrow mt12"><input type="checkbox" id="al-rem"><span class="small">จำไว้ในเครื่องนี้ (ใช้เฉพาะเครื่องของคุณเอง)</span></label><div id="al-err" class="mt8"></div>' +
      '<div class="mbtns"><button class="btn ghost" data-act="modal-close">ยกเลิก</button><button class="btn primary" id="al-go" data-act="al-go">เข้าสู่ระบบ</button></div>', { label: 'เข้าสู่ระบบผู้ดูแล', cls: 'small' });
    const inp = $('#al-key'); if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ACT['al-go'](); } });
  }
  ACT['admin-login'] = () => openLogin();
  ACT['al-go'] = async () => {
    const k = ($('#al-key') || {}).value || '', err = t => { const e = $('#al-err'); if (e) e.innerHTML = t ? '<div class="err box">' + icon('warn') + '<span>' + esc(t) + '</span></div>' : ''; };
    if (!k) return err('กรุณาใส่รหัสผู้ดูแล');
    const b = $('#al-go'); if (b) { b.classList.add('off'); b.textContent = 'กำลังตรวจสอบ…'; }
    const r = await BUU.login(k, !!($('#al-rem') || {}).checked);
    if (r.ok) { location.hash = ''; location.reload(); return; }
    if (b) { b.classList.remove('off'); b.textContent = 'เข้าสู่ระบบ'; }
    err(r.code === 'unauthorized' ? 'รหัสไม่ถูกต้อง (หรือยังไม่ได้ตั้ง ADMIN_KEY ใน Code.gs และ Deploy ใหม่)' : r.code === 'not_configured' ? 'ยังไม่ได้รัน setup ในหน้า Apps Script' : 'เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจอินเทอร์เน็ตและลิงก์ใน config.js');
  };
  ACT['admin-logout'] = async () => { if (await askConfirm('ออกจากระบบผู้ดูแล', 'หน้านี้จะกลับไปเป็นมุมมองของผู้ทิ้งทั่วไป เข้าใหม่ได้ด้วยรหัสผู้ดูแล', 'ออกจากระบบ')) BUU.logout(); };
  ACT['net-retry'] = () => { BUU.retry(); toast('กำลังลองเชื่อมต่อใหม่…'); };
  window.addEventListener('buu-net', () => { try { renderBanner(); } catch (e) { } });
  BUU.afterBoot = () => {
    const f = BUU.takeFlag();
    if (f === 'unauth') toast('รหัสผู้ดูแลไม่ถูกต้องหรือหมดอายุ กรุณาเข้าสู่ระบบใหม่', 'err');
    const adminHash = () => /^#admin$/i.test(location.hash);
    const act = () => { if (!adminHash()) return; history.replaceState(null, '', location.pathname + location.search); openLogin(); };
    if (Store.isAdmin && f === 'openadmin') Admin.open();
    else act();
    window.addEventListener('hashchange', act);
  };
}

/* ============ 90_boot.js — event delegation, data → view refresh, start-up ============ */
'use strict';
ACT.go = el => go(el.dataset.v, { fresh: !!el.dataset.fresh });
ACT['modal-close'] = () => closeModal();
ACT['sample-off'] = () => { Store.setSample(false); renderBanner(); if (typeof Admin !== 'undefined' && Admin.open) Admin.render(); else renderView(); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') e.preventDefault();
  try { const r = f(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast('เกิดข้อผิดพลาด ลองอีกครั้ง', 'err'); }); } catch (err) { console.error(err); toast('เกิดข้อผิดพลาด ลองอีกครั้ง', 'err'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen()) { closeModal(); } });

function dueCount() { const D = Store.D; if (!D || !Store.settled) return 0; return D.pts.filter(p => LV[D.bins[p.id].lv] >= LV.due).length; }   /* 0 until every collection has loaded, so a half-loaded db never raises a false alarm */
function updateAdminBadge() {
  const b = $('#btn-admin'); if (!b) return; b.hidden = !Store.isAdmin; const n = Store.isAdmin ? dueCount() : 0, d = $('#admin-dot');
  d.hidden = !n; d.textContent = n; b.setAttribute('aria-label', 'เปิดหลังบ้าน (ผู้พัฒนา)' + (n ? ' มี ' + n + ' จุดถึงกำหนดเก็บ' : ''));
}
function onData() {
  updateAdminBadge();
  if (typeof Admin !== 'undefined' && Admin.refresh) { Admin.refresh(); if (Admin.isOpen) return; }   /* public view sits under the overlay while the back office is open */
  const v = S.view, y = window.scrollY;
  if (v === 'home' || v === 'mine') { renderView(); window.scrollTo(0, y); }
  else if (v === 'map') { if (S.map) S.map.setPins(pinList(false)); fillPList(); fillSheet(); }
  else if (v === 'drop' && S.draft) { const p = ptOf(S.draft.pt); if (S.draft.pt && !p) { S.draft.pt = ''; renderView(); } }
}
function onHash() { const id = Scan.parse(location.hash); if (id && ptOf(id)) { go('drop', { pt: id, viaQR: true }); } }

async function boot() {
  try { await Store.init(); } catch (e) { console.error(e); Store.mode = 'local'; Store.ready = true; }
  Store.on(onData); renderBanner(); updateAdminBadge();
  let id = Scan.parse(location.hash);
  if (id && !ptOf(id) && id[0] === 'c') { const t0 = Date.now(); while (!Store.settled && Date.now() - t0 < 4000) await sleep(60); }   /* a QR of a point the admin added: wait for the points list */
  if (id && ptOf(id)) go('drop', { pt: id, viaQR: true }); else go('home');
  window.addEventListener('hashchange', onHash);
  if (window.BUU && BUU.afterBoot) BUU.afterBoot();
  const tick = () => { if (!document.hidden && Store.ready) { Store.recompute(); Store.emit(); } };   /* ages & "due by days" move with the clock */
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', tick);
  window.__ready = true;
}
boot();

</script>
